<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上榜公报 · 宣传海报（打印/截图即用）</title>
<style>
:root{--paper:#f6f2ea;--ink:#1c1813;--red:#c23a1e;--gold:#a07c2c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#3a3630;font-family:"Songti SC","SimSun",serif;padding:24px}
.poster{max-width:600px;margin:0 auto;background:var(--paper);color:var(--ink);padding:46px 40px;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.poster::before{content:"";position:absolute;inset:12px;border:2px solid var(--ink);pointer-events:none}
.poster::after{content:"";position:absolute;inset:18px;border:1px solid var(--gold);opacity:.6;pointer-events:none}
.seal{position:absolute;top:34px;right:38px;width:74px;height:74px;background:var(--red);transform:rotate(-5deg);
  display:flex;align-items:center;justify-content:center;border-radius:5px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 0 0 5px var(--red),inset 0 0 0 6.5px rgba(255,255,255,.4)}
.seal span{font-size:40px;color:#fff;font-weight:900}
.kicker{text-align:center;font-size:12px;letter-spacing:.5em;color:var(--red);margin-bottom:14px}
h1{text-align:center;font-size:52px;font-weight:900;letter-spacing:.08em;margin:8px 0 6px}
.sub{text-align:center;font-size:15px;color:#6e675a;margin-bottom:26px}
.vs{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px 0;border-top:1px solid #ddd5c5;border-bottom:1px solid #ddd5c5;padding:18px 0}
.vs .who{text-align:center}.vs .who b{font-size:19px;display:block}.vs .who i{font-style:normal;font-family:ui-monospace,monospace;font-size:13px;color:var(--red)}
.vs .x{font-size:30px;font-weight:900;color:var(--red)}
.rules{font-size:13.5px;text-align:center;line-height:2;margin:10px 0 20px}
.rules b{color:var(--red)}
.url{text-align:center;font-family:ui-monospace,monospace;font-size:16px;font-weight:700;letter-spacing:.02em;
  border:1.5px solid var(--ink);border-radius:4px;padding:10px;margin:0 30px;display:block}
.hint{text-align:center;font-size:11px;color:#a39a89;margin-top:12px}
@media print{ body{background:none;padding:0} .poster{box-shadow:none;margin:0} .noprint{display:none} }
.noprint{text-align:center;margin-top:18px}
.noprint button{background:var(--red);color:#fff;border:none;padding:10px 28px;font-size:15px;border-radius:4px;cursor:pointer;font-family:sans-serif}
</style>
</head>
<body>
<div class="poster">
  <div class="seal"><span>榜</span></div>
  <div class="kicker">全站实时竞拍 · 价高者得</div>
  <h1>上榜公报</h1>
  <p class="sub">排名就是出价，别的不算。想上位？加钱❗</p>
  <div class="vs">
    <div class="who"><b>泡泡玛特 LABUBU</b><i>¥52,800 · 总榜魁首</i></div>
    <span class="x">VS</span>
    <div class="who"><b>瑞幸咖啡</b><i>¥18,600 · 咖啡一哥</i></div>
  </div>
  <p class="rules">
    整元出价，<b>¥5 起步</b><br>
    USDT 出价 → 链上确认 → 自动上墙<br>
    随时被反超，加 ¥1 立刻夺回
  </p>
  <span class="url">erza-di.github.io/shangbang</span>
  <p class="hint">扫码或输入网址 · 每一笔加价实时改写榜单</p>
</div>
<p class="noprint noprint"><button onclick="window.print()">打印 / 存 PDF</button></p>
</body>
</html>
